<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<fontconfig>
    # <!--
    #     为你电脑上的字体配置后备字体序列。
    #     每个字体对应一个<alias> 小节。
    # -->
    # <alias>
    #     <!--
    #         <family> 字段，是你要设置后备字体的字体名称。
    #         【提示】字体名称可以是字体的中文名（在WPS等软件看到的名字），例如“宋体”
    #     -->
    #     <family>Noto Sans</family> <!-- 这里的Noto Sans是一个英文字体，我们需要为其配置后备中文字体。 -->
    #     <!--
    #         <prefer> 字段，是一个后备字体的列表，可以包含多个<family>字段。
    #         后备字体的显示顺序自上而下排列，优先显示排序靠前的字体，
    #         如果靠前的字体没有可以显示的字符，那么后面的字体就会顶上。
    #     -->
    #     <prefer>
    #         <family>Noto Sans SC</family>            <!-- 建议使用 Noto Sans SC 作为兜底 -->
    #     </prefer>
    # </alias>

    # <!--
    #     后面的设置项，格式都是一样的，这里不再赘述。
    # -->

    # <alias>
    #     <family>Noto Sans Mono</family>
    #     <prefer>
    #         <family>Noto Sans Mono SC</family>
    #         <family>Noto Sans SC</family>
    #     </prefer>
    # </alias>

    <!-- Default system-ui fonts -->
    <match target="pattern">
        <test name="family">
            <string>system-ui</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>sans-serif</string>
        </edit>
    </match>

    <!-- Default sans-serif fonts-->
    <match target="pattern">
        <test name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans SC</string>
            <string>Noto Sans</string>
            <string>Noto Color Emoji</string>
            <string>Maple Mono NF CN</string>
        </edit>
    </match>

    <!-- Default serif fonts-->
    <match target="pattern">
        <test name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Serif SC</string>
            <string>Noto Serif</string>
            <string>Noto Color Emoji</string>
            <string>Maple Mono NF CN</string>
        </edit>
    </match>

    <!-- Default monospace fonts-->
    <match target="pattern">
        <test name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Maple Mono NF CN</string>
            <string>Noto Color Emoji</string>
        </edit>
    </match>


    <!-- use English font for en lang -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>en</string>
        </test>
        <test name="family" compare="contains">
            <string>Noto Sans SC</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans</string>
        </edit>
    </match>


</fontconfig>

